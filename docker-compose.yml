version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        user: www
        uid: 1000
    image: minipos-app
    container_name: minipos-app
    restart: unless-stopped
    tty: true
    environment:
      SERVICE_NAME: app
      SERVICE_TAGS: dev
    working_dir: /var/www
    volumes:
      - ./:/var/www
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    networks:
      - minipos-network
    depends_on:
      - db

  webserver:
    image: nginx:alpine
    container_name: minipos-webserver
    restart: unless-stopped
    tty: true
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/conf.d/:/etc/nginx/conf.d/
    networks:
      - minipos-network
    depends_on:
      - app

  db:
    image: mysql:8.0
    container_name: minipos-db
    restart: unless-stopped
    tty: true
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: minipos_db
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_USER: minipos_user
      MYSQL_PASSWORD: minipos_password
      SERVICE_TAGS: dev
      SERVICE_NAME: mysql
    volumes:
      - minipos-db-data:/var/lib/mysql
    networks:
      - minipos-network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: minipos-phpmyadmin
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_USER: minipos_user
      PMA_PASSWORD: minipos_password
    networks:
      - minipos-network
    depends_on:
      - db

  queue-worker:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        user: www
        uid: 1000
    image: minipos-app
    container_name: minipos-queue-worker
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    command: php artisan queue:work --tries=3 --timeout=90
    networks:
      - minipos-network
    depends_on:
      - app
      - db

networks:
  minipos-network:
    driver: bridge

volumes:
  minipos-db-data:
    driver: local
